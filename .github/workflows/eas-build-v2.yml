name: EAS iOS Build v2

on:
  workflow_dispatch:
    inputs:
      message:
        description: "Build message (optional)"
        required: false
        default: "Manual build"

jobs:
  build:
    name: Build iOS for App Store
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install all workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install EAS CLI globally
        run: npm install -g eas-cli

      - name: Write Apple ASC API Key
        run: |
          printf '%s' '${{ secrets.APPLE_ASC_KEY_P8 }}' > /tmp/AuthKey_QCAYN569MP.p8
          chmod 600 /tmp/AuthKey_QCAYN569MP.p8

      - name: Validate Apple ASC API Key
        run: |
          FILE_SIZE=$(wc -c < /tmp/AuthKey_QCAYN569MP.p8)
          echo "APPLE_ASC_KEY_P8 size: ${FILE_SIZE} bytes"
          FIRST_LINE=$(head -1 /tmp/AuthKey_QCAYN569MP.p8 2>/dev/null || echo "EMPTY")
          echo "Key header line: $FIRST_LINE"
          if [ "$FILE_SIZE" -lt 50 ]; then
            echo ""
            echo "========================================================"
            echo "ERROR: APPLE_ASC_KEY_P8 GitHub secret is empty or unset."
            echo ""
            echo "Fix: Go to your GitHub repo → Settings → Secrets →"
            echo "  Actions → New repository secret"
            echo "  Name:  APPLE_ASC_KEY_P8"
            echo "  Value: paste the full contents of your AuthKey_QCAYN569MP.p8"
            echo "         file (include the -----BEGIN PRIVATE KEY----- lines)"
            echo "========================================================"
            exit 1
          fi
          echo "Key file looks valid (${FILE_SIZE} bytes)"

      - name: Run EAS Build — clear stale credentials and auto-provision
        working-directory: artifacts/starlight
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_ASC_API_KEY_ID: QCAYN569MP
          EXPO_ASC_API_KEY_ISSUER_ID: 37db5320-f7a1-4c2f-a01d-9d1ee4e2c409
          EXPO_ASC_API_KEY_PATH: /tmp/AuthKey_QCAYN569MP.p8
          EAS_BUILD_NO_EXPO_GO_WARNING: "true"
        run: |
          npx eas-cli build \
            --platform ios \
            --profile production \
            --non-interactive \
            --clear-credentials

      - name: Show build URL
        if: always()
        run: |
          echo "View build status at:"
          echo "https://expo.dev/accounts/dfeliciano51/projects/starlight/builds"
