name: EAS iOS Build v2

on:
  workflow_dispatch:
    inputs:
      message:
        description: "Build message (optional)"
        required: false
        default: "Manual build"

jobs:
  build:
    name: Build iOS for App Store
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install all workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install EAS CLI globally
        run: npm install -g eas-cli

      - name: Validate required secrets are present
        run: |
          MISSING=0

          P12_SIZE=$(printf '%s' '${{ secrets.DIST_CERT_P12_BASE64 }}' | wc -c)
          if [ "$P12_SIZE" -lt 100 ]; then
            echo "❌  DIST_CERT_P12_BASE64 is empty or missing."
            MISSING=1
          else
            echo "✅  DIST_CERT_P12_BASE64 present (${P12_SIZE} chars)"
          fi

          PASS_SIZE=$(printf '%s' '${{ secrets.DIST_CERT_PASSWORD }}' | wc -c)
          if [ "$PASS_SIZE" -lt 1 ]; then
            echo "❌  DIST_CERT_PASSWORD is empty or missing."
            MISSING=1
          else
            echo "✅  DIST_CERT_PASSWORD present"
          fi

          PROF_SIZE=$(printf '%s' '${{ secrets.PROVISIONING_PROFILE_BASE64 }}' | wc -c)
          if [ "$PROF_SIZE" -lt 100 ]; then
            echo "❌  PROVISIONING_PROFILE_BASE64 is empty or missing."
            MISSING=1
          else
            echo "✅  PROVISIONING_PROFILE_BASE64 present (${PROF_SIZE} chars)"
          fi

          if [ "$MISSING" -eq 1 ]; then
            echo ""
            echo "================================================================"
            echo "  ACTION REQUIRED — add these 3 secrets to your GitHub repo:"
            echo "  Settings → Secrets → Actions → New repository secret"
            echo ""
            echo "  DIST_CERT_P12_BASE64"
            echo "    On your Mac:  base64 -i StarLight.p12 | pbcopy"
            echo "    Export from Keychain Access → My Certificates →"
            echo "    right-click Apple Distribution: <your name> → Export"
            echo ""
            echo "  DIST_CERT_PASSWORD"
            echo "    The password you chose when exporting the .p12"
            echo ""
            echo "  PROVISIONING_PROFILE_BASE64"
            echo "    Download your App Store profile from:"
            echo "    developer.apple.com → Certificates, IDs & Profiles → Profiles"
            echo "    Filter: App Store, bundle com.starlight.enterprise"
            echo "    Then:  base64 -i StarLight_AppStore.mobileprovision | pbcopy"
            echo "================================================================"
            exit 1
          fi

      - name: Write credentials to disk
        run: |
          printf '%s' '${{ secrets.DIST_CERT_P12_BASE64 }}' | base64 -d > /tmp/star.p12
          printf '%s' '${{ secrets.PROVISIONING_PROFILE_BASE64 }}' | base64 -d > /tmp/star.mobileprovision
          echo "Cert size:    $(wc -c < /tmp/star.p12) bytes"
          echo "Profile size: $(wc -c < /tmp/star.mobileprovision) bytes"

      - name: Write EAS credentials.json
        working-directory: artifacts/starlight
        run: |
          node -e "
          const fs = require('fs');
          const creds = {
            ios: {
              distributionCertificate: {
                path: '/tmp/star.p12',
                password: process.env.DIST_CERT_PASSWORD
              },
              provisioningProfilePath: '/tmp/star.mobileprovision'
            }
          };
          fs.writeFileSync('credentials.json', JSON.stringify(creds, null, 2));
          console.log('credentials.json written');
          "
        env:
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}

      - name: Run EAS Build (local credentials)
        working-directory: artifacts/starlight
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_BUILD_NO_EXPO_GO_WARNING: "true"
        run: |
          npx eas-cli build \
            --platform ios \
            --profile production \
            --non-interactive

      - name: Show build URL
        if: always()
        run: |
          echo "View build status at:"
          echo "https://expo.dev/accounts/dfeliciano51/projects/starlight/builds"
