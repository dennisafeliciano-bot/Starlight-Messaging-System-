kind = "mobile"
previewPath = "/"
title = "StarLight"
version = "1.0.0"
id = "artifacts/starlight"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 18377

[services.development]
run = "pnpm --filter @workspace/starlight run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/starlight", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/starlight", "run", "serve" ]

[services.env]
PORT = "18377"
BASE_PATH = "/"
